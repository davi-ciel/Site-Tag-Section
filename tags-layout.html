<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tags de Layout HTML</title>
  <style>

    body {
      background-color: #fff;
      color: #000;
      font-family: sans-serif;
      padding: 30px;
    }

    h1 {
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    /* --- DIAGRAMA --- */

    .diagrama {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 500px;
      margin: 0 auto;
    }

    .tag-bloco {
      border: 1px solid #000;
      padding: 10px 14px;
      cursor: pointer;
      background-color: #fff;
    }

    .tag-bloco:hover {
      background-color: #f0f0f0;
    }

    .tag-bloco p {
      font-size: 11px;
      color: #555;
      font-family: monospace;
      margin-bottom: 2px;
    }

    .tag-bloco strong {
      font-size: 15px;
      letter-spacing: 0.05em;
    }

    /* linha do meio: nav + artigo/section + aside */

    .linha-meio {
      display: flex;
      gap: 6px;
    }

    .bloco-nav {
      width: 60px;
      border: 1px solid #000;
      padding: 10px 6px;
      cursor: pointer;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .bloco-nav:hover {
      background-color: #f0f0f0;
    }

    .bloco-nav p {
      font-size: 10px;
      color: #555;
      font-family: monospace;
      writing-mode: vertical-rl;
    }

    .bloco-nav strong {
      font-size: 13px;
      writing-mode: vertical-rl;
    }

    .bloco-aside {
      width: 60px;
      border: 1px solid #000;
      padding: 10px 6px;
      cursor: pointer;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .bloco-aside:hover {
      background-color: #f0f0f0;
    }

    .bloco-aside p {
      font-size: 10px;
      color: #555;
      font-family: monospace;
      writing-mode: vertical-rl;
    }

    .bloco-aside strong {
      font-size: 13px;
      writing-mode: vertical-rl;
    }

    .coluna-centro {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* destaque da section */

    .bloco-section {
      border: 2px solid #000 !important;
      background-color: #f0f0f0 !important;
    }

    .bloco-section .aviso-foco {
      font-size: 10px;
      color: #000;
      text-align: right;
      font-family: monospace;
      margin-bottom: 4px;
    }

    .bloco-section .dica-clique {
      font-size: 10px;
      color: #555;
      text-align: center;
      margin-top: 4px;
    }

    /* --- PAINEL DE INFORMAÇÕES --- */

    .painel {
      display: none;
      max-width: 500px;
      margin: 20px auto 0;
      border: 1px solid #000;
      padding: 20px;
    }

    .painel.aberto {
      display: block;
    }

    .painel-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid #000;
      padding-bottom: 10px;
    }

    .painel-topo h2 {
      font-family: monospace;
      font-size: 20px;
    }

    .btn-fechar {
      background: none;
      border: 1px solid #000;
      padding: 4px 10px;
      cursor: pointer;
      font-family: sans-serif;
      font-size: 14px;
    }

    .btn-fechar:hover {
      background-color: #f0f0f0;
    }

    .painel p {
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .lista-atributos {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .lista-atributos span {
      border: 1px solid #000;
      padding: 3px 10px;
      font-size: 11px;
      font-family: monospace;
    }

    .bloco-codigo {
      background-color: #f0f0f0;
      border: 1px solid #000;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre;
      overflow-x: auto;
      margin-bottom: 14px;
    }

    .dica-section {
      border-left: 3px solid #000;
      padding: 10px 14px;
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.6;
    }

  </style>
</head>
<body>

  <h1>Tags de Layout HTML</h1>
  <p style="text-align:center; margin-bottom: 30px;">Clique em qualquer tag para ver o que ela faz</p>

  <!-- DIAGRAMA -->
  <div class="diagrama">

    <div class="tag-bloco" onclick="abrirPainel('header')">
      <p>&lt;header&gt;</p>
      <strong>HEADER</strong>
    </div>

    <div class="linha-meio">

      <div class="bloco-nav" onclick="abrirPainel('nav')">
        <p>&lt;nav&gt;</p>
        <strong>NAV</strong>
      </div>

      <div class="coluna-centro">

        <div class="tag-bloco" onclick="abrirPainel('article')">
          <p>&lt;article&gt;</p>
          <strong>ARTICLE</strong>
        </div>

        <div class="tag-bloco bloco-section" onclick="abrirPainel('section')">
          <p class="aviso-foco">★ foco</p>
          <p>&lt;section&gt;</p>
          <strong>SECTION</strong>
          <p class="dica-clique">clique para explorar</p>
        </div>

      </div>

      <div class="bloco-aside" onclick="abrirPainel('aside')">
        <p>&lt;aside&gt;</p>
        <strong>ASIDE</strong>
      </div>

    </div>

    <div class="tag-bloco" onclick="abrirPainel('footer')">
      <p>&lt;footer&gt;</p>
      <strong>FOOTER</strong>
    </div>

  </div>

  <!-- PAINEL DE INFORMAÇÕES -->
  <div class="painel" id="painel">
    <div class="painel-topo">
      <h2 id="painel-titulo"></h2>
      <button class="btn-fechar" onclick="fecharPainel()">✕ fechar</button>
    </div>
    <div id="painel-conteudo"></div>
  </div>


  <script>

    const informacoes = {
      header: {
        titulo: "<header>",
        descricao: "Define o cabeçalho da página ou de uma seção. Geralmente contém o logotipo, título principal, navegação ou elementos introdutórios.",
        atributos: ['role="banner"', "logo", "nav", "h1"],
        codigo: '<header>\n  <h1>Meu Site</h1>\n  <nav>...</nav>\n</header>',
        onde: "Onde usar: no topo da página ou dentro de article e section para introduzir um bloco.",
        dica: ""
      },
      nav: {
        titulo: "<nav>",
        descricao: "Agrupa links de navegação principais do site. Indica ao navegador e leitores de tela que aqui estão os menus de direção do usuário.",
        atributos: ['role="navigation"', "links", "menu", "aria-label"],
        codigo: '<nav>\n  Início\n  Sobre\n</nav>',
        onde: "Onde usar: menu principal, breadcrumbs, paginação. Evite usar para qualquer grupo de links.",
        dica: ""
      },
      article: {
        titulo: "<article>",
        descricao: "Representa um conteúdo autônomo e reutilizável — algo que faz sentido sozinho, como um post de blog, notícia ou comentário.",
        atributos: ["independente", "reutilizável", "rss", "syndication"],
        codigo: '<article>\n  <h2>Título do Post</h2>\n  <section>Introdução</section>\n  <section>Corpo</section>\n</article>',
        onde: "Onde usar: posts, notícias, produtos, cards. Pode conter várias seções internas.",
        dica: ""
      },
      section: {
        titulo: "<section>",
        descricao: "Agrupa conteúdo relacionado dentro de uma página ou artigo, formando uma divisão temática com significado próprio. Diferente de <div>, a <section> carrega semântica — ela diz que este bloco tem um tema.",
        atributos: ["semântica", "thematic group", "heading obrigatório", "acessibilidade"],
        codigo: '<section>\n  <h2>Introdução</h2>\n  <p>Conteúdo relacionado...</p>\n</section>\n\n<section>\n  <h2>Exemplos práticos</h2>\n  <p>Mais conteúdo...</p>\n</section>',
        onde: "Onde usar: capítulos de um artigo, abas de conteúdo, grupos de features, áreas temáticas distintas numa página.",
        dica: "✦ Regra de ouro: se a sua &lt;section&gt; não tiver um &lt;h2&gt; ou &lt;h3&gt;, provavelmente deveria ser um &lt;div&gt;. A tag ganha sentido real quando cada bloco tem um título que o descreve."
      },
      aside: {
        titulo: "<aside>",
        descricao: "Conteúdo relacionado indiretamente ao conteúdo principal — como barras laterais, notas, publicidade, citações ou widgets complementares.",
        atributos: ['role="complementary"', "sidebar", "relacionado", "widgets"],
        codigo: '<aside>\n  <h3>Veja também</h3>\n  <ul>\n    <li>Artigo relacionado</li>\n  </ul>\n</aside>',
        onde: "Onde usar: barra lateral de um blog, notas inline, painéis de informação extra que não são essenciais ao fluxo principal.",
        dica: ""
      },
      footer: {
        titulo: "<footer>",
        descricao: "Define o rodapé de uma página ou seção. Contém informações como copyright, links secundários, contato ou metadados do autor.",
        atributos: ['role="contentinfo"', "copyright", "links secundários", "meta"],
        codigo: '<footer>\n  <p>© 2026 Meu Site</p>\n  <nav>Política de privacidade</nav>\n</footer>',
        onde: "Onde usar: no final da página ou dentro de article para indicar informações do autor, data de publicação etc.",
        dica: ""
      }
    };

    function abrirPainel(tag) {
      const info = informacoes[tag];

      document.getElementById("painel-titulo").textContent = info.titulo;

      const atributosHTML = info.atributos
        .map(a => `<span>${a}</span>`)
        .join("");

      const dicaHTML = info.dica
        ? `<div class="dica-section"><p>${info.dica}</p></div>`
        : "";

      document.getElementById("painel-conteudo").innerHTML = `
        <p>${info.descricao}</p>
        <div class="lista-atributos">${atributosHTML}</div>
        <div class="bloco-codigo">${info.codigo}</div>
        <p>${info.onde}</p>
        ${dicaHTML}
      `;

      document.getElementById("painel").classList.add("aberto");
      document.getElementById("painel").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function fecharPainel() {
      document.getElementById("painel").classList.remove("aberto");
    }

  </script>

</body>
</html>
